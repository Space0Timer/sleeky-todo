name: CI

on:
  # No push trigger. A pull_request run already builds the merge of the branch
  # with develop, so running the same suite again after the merge pays twice
  # for one answer.
  pull_request:
    branches: [develop]
    # ready_for_review starts the run a draft skipped; without it, marking a
    # pull request ready would need an empty commit to get an answer.
    types: [opened, synchronize, reopened, ready_for_review]
    # A change to prose cannot break the build, and the workflow and scripts
    # are not in this list, so a change to CI itself still runs.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# A newer commit on the same branch makes the previous run's answer stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"

# Every job carries the same condition: a draft pull request does not run, so
# iterating on a branch costs nothing and the suite runs once when the change is
# marked ready. A manual run is not a pull request, so it is never gated.
#
# ready_for_review is named on its own because the payload for that action
# still reports the pull request as a draft, so testing the flag alone skips
# the very run that marking a change ready is supposed to start.
jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      || github.event.action == 'ready_for_review'
      || github.event.pull_request.draft == false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: >-
            ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj',
            'Directory.Packages.props', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Sleeky.Todo.sln

      # Analyzer rules are enforced by the build, which treats warnings as
      # errors, so this checks whitespace only and does not re-run analyzers.
      - name: Verify formatting
        run: dotnet format whitespace Sleeky.Todo.sln --verify-no-changes --no-restore

      # Rules the standard states but no analyzer can check. Each entry is a
      # pattern that must not appear, with the reason it is banned.
      - name: Check banned patterns
        run: bash .github/scripts/check-banned-patterns.sh

      - name: Build
        run: dotnet build Sleeky.Todo.sln --configuration Release --no-restore

      # The integration suite starts its own MongoDB through Testcontainers, so
      # the runner's Docker daemon is the only dependency; compose is not
      # needed here.
      - name: Test
        env:
          RUN_MONGODB_INTEGRATION_TESTS: "true"
        run: |
          dotnet test Sleeky.Todo.sln \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --settings tests/coverage.runsettings \
            --logger trx \
            --results-directory artifacts/test-results

      # A suite that skips itself prints the same "Failed: 0" as one that
      # passed, so the skip count is checked rather than assumed.
      - name: Assert that no test was skipped
        run: python3 .github/scripts/check-test-results.py artifacts/test-results

      - name: Merge coverage
        run: |
          dotnet reportgenerator \
            "-reports:artifacts/test-results/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage" \
            "-reporttypes:Cobertura;HtmlInline;MarkdownSummaryGithub"

      - name: Publish coverage to the job summary
        run: cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # Thresholds sit just under the measured baseline of 91.4% line and
      # 78.1% branch. Raise them as the baseline rises.
      - name: Enforce coverage thresholds
        run: |
          python3 .github/scripts/check-coverage.py \
            artifacts/coverage/Cobertura.xml \
            --min-line 89 \
            --min-branch 75

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            artifacts/test-results/**/*.trx
            artifacts/coverage/
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      || github.event.action == 'ready_for_review'
      || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: src/sleeky-todo-web
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/sleeky-todo-web/.nvmrc

      - name: Enable Corepack
        run: corepack enable

      # Resolved after Corepack is enabled rather than assumed, because the
      # location depends on the project's own Yarn configuration.
      - name: Resolve the Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('src/sleeky-todo-web/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install
        run: corepack yarn install --immutable

      # Declarations for the CSS modules are generated rather than committed,
      # and both the type-aware lint and the build below need them on disk.
      - name: Generate CSS module types
        run: corepack yarn css-types

      - name: Lint
        run: corepack yarn lint:js

      # Separate from the step above so a styling failure is attributable
      # without opening the log.
      - name: Lint styles
        run: corepack yarn lint:styles

      # Covers what the browser suite cannot reach: the event-stream parser's
      # behaviour at chunk boundaries a browser test has no way to control.
      - name: Unit test
        run: corepack yarn test:unit

      # Also the type check: the build script runs tsc before Vite.
      - name: Build
        run: corepack yarn build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      || github.event.action == 'ready_for_review'
      || github.event.pull_request.draft == false
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: sleeky-todo
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Playwright starts the API itself through its webServer configuration,
      # so this job needs the .NET toolchain as well as Node.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/sleeky-todo-web/.nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: >-
            ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj',
            'Directory.Packages.props', '.config/dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Resolve the Yarn cache folder
        id: yarn-cache
        working-directory: src/sleeky-todo-web
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('src/sleeky-todo-web/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install client dependencies
        working-directory: src/sleeky-todo-web
        run: corepack yarn install --immutable

      # The https launch profile the tests use cannot bind without a
      # development certificate, which a fresh runner does not have.
      - name: Create a development certificate
        run: dotnet dev-certs https

      # Built ahead of time so the webServer start-up timeout is not spent on a
      # cold restore and build.
      - name: Build the API
        run: dotnet build src/Sleeky.Todo.Api/Sleeky.Todo.Api.csproj

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: >-
            ${{ runner.os }}-playwright-${{
            hashFiles('src/sleeky-todo-web/yarn.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install the Playwright browser
        working-directory: src/sleeky-todo-web
        run: corepack yarn playwright install --with-deps chromium

      # Keycloak is required, not optional: the browser suite drives the real
      # login form. --wait covers its realm import, which takes longer than the
      # first test would wait on its own.
      - name: Start MongoDB and Keycloak
        run: |
          docker compose up -d --wait mongodb keycloak
          docker compose up mongodb-init

      - name: Run the browser tests
        working-directory: src/sleeky-todo-web
        run: corepack yarn test:e2e

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            src/sleeky-todo-web/playwright-report/
            src/sleeky-todo-web/test-results/
          if-no-files-found: ignore

      - name: Stop the containers
        if: always()
        run: docker compose down --volumes

  docker:
    name: docker
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      || github.event.action == 'ready_for_review'
      || github.event.pull_request.draft == false
    needs: [backend, frontend, e2e]
    env:
      COMPOSE_PROJECT_NAME: sleeky-todo
      IMAGE_TAG: sleeky-todo:${{ github.sha }}
      KEYS_VOLUME: sleeky-todo-keys
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start MongoDB
        run: |
          docker compose up -d --wait mongodb
          docker compose up mongodb-init

      # The image runs on the compose network with a direct connection rather
      # than through the replica set, because the set advertises its member as
      # localhost, which does not resolve from another container. The smoke
      # test proves the image boots and serves; the transactional paths are
      # covered by the integration suite.
      - name: Start the image
        run: |
          docker run --detach --name sleeky-todo-smoke \
            --network "${COMPOSE_PROJECT_NAME}_default" \
            --publish 8080:8080 \
            --volume "${KEYS_VOLUME}:/keys" \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env 'MongoDb__ConnectionString=mongodb://mongodb:27017/?directConnection=true' \
            --env MongoDb__DatabaseName=sleekyTodoSmoke \
            --env 'Authentication__Authority=https://example.invalid/realms/smoke' \
            --env Authentication__ClientId=smoke \
            "$IMAGE_TAG"

      - name: Wait for the container to report healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8080/health; then
              echo "Healthy after ${attempt}s."
              exit 0
            fi
            sleep 1
          done
          echo "::error::The container never served /health."
          docker logs sleeky-todo-smoke
          exit 1

      # Session cookies and every stored provider key are encrypted with the
      # key ring, so a deployment mounts it to outlive the container. The image
      # runs as a non-root user and a named volume takes its ownership from the
      # directory it covers, so this proves that directory is one the app can
      # actually write rather than a root-owned mount it will fail on later.
      - name: Check that the mounted key ring is writable
        run: docker exec sleeky-todo-smoke sh -c 'touch /keys/.ci-probe'

      # /api/auth/me is anonymous and needs no database, so it answers 200 in a
      # container that started correctly. Swagger is deliberately not checked:
      # it is registered in development only, which the integration suite
      # covers instead.
      - name: Check the anonymous API surface
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8080/api/auth/me)
          if [ "$status" != "200" ]; then
            echo "::error::/api/auth/me answered $status rather than 200."
            docker logs sleeky-todo-smoke
            exit 1
          fi
          echo "/api/auth/me answered 200."

      # The client is served from this origin, so an anonymous visitor must
      # receive the shell rather than the 401 an unmatched path would earn.
      # This is the check that proves the image ships a usable client, not only
      # a running API.
      - name: Check that the client is served
        run: |
          body=$(mktemp)
          status=$(curl --silent --output "$body" --write-out '%{http_code}' \
            http://localhost:8080/)
          if [ "$status" != "200" ]; then
            echo "::error::/ answered $status rather than 200."
            docker logs sleeky-todo-smoke
            exit 1
          fi
          if ! grep -q '<div id="root">' "$body"; then
            echo "::error::/ answered 200 without the client shell."
            head -c 500 "$body"
            exit 1
          fi
          echo "/ served the client shell."

      - name: Stop the container
        if: always()
        run: |
          docker logs sleeky-todo-smoke || true
          docker rm --force sleeky-todo-smoke || true
          docker volume rm "$KEYS_VOLUME" || true
          docker compose down --volumes
